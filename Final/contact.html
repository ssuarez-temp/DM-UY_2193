<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title-contact">Contacto</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <div class="title-main">
        <h1 data-i18n="contact">Contacto</h1>
    </div>

    <div class="contact-container">

        <form action="https://formspree.io/f/mojkdzwn" method="POST">

            <input type="hidden" name="_subject" value="New Response has Dropped">
            <input type="hidden" name="_redirect" value="thanks.html">
            <input type="text" name="_gotcha" style="display:none">

            <label data-i18n="contact_name">Nombre</label>
            <input type="text" name="name" required>

            <label data-i18n="contact_email">Email</label>
            <input type="email" name="email" required>

            <label data-i18n="contact_message">Mensaje</label>
            <textarea name="message" rows="10" placeholder="Write your message here..." required></textarea>

            <button type="submit" data-i18n="sumbit">Enviar</button>

        </form>

    </div>

    <div id="footer-placeholder"></div>

    <script src="js/nightmode.js"></script>
    <script src="js/search.js"></script>
    <script src="js/carousel.js"></script>
    <script src="js/components-loader.js"></script>

</body>
