    <div class="contact-container">

        <form action="https://formspree.io/f/mojkdzwn" method="POST">

            <input type="hidden" name="_subject" value="New Response has Dropped">
            <input type="hidden" name="_redirect" value="thanks.html">
            <input type="text" name="_gotcha" style="display:none">

            <label>Nombre</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Mensaje</label>
            <textarea name="message" rows="10" placeholder="Escribe tu mensaje aquí..." required></textarea>

            <button type="submit">Enviar</button>

        </form>
